# Optional: a real Qdrant server instead of the embedded mode.
# Then set QDRANT_URL=http://localhost:6333 in .env and re-run ingestion.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
